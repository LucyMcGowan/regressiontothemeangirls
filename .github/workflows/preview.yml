name: Preview

# Builds the site for any PR, including ones from forks. Runs with
# read-only permissions and never touches gh-pages directly — deployment
# happens in preview-deploy.yml, which runs with write access in the
# context of the base repo (not the fork's code) after this completes.
on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    concurrency:
      group: preview-build-${{ github.event.pull_request.number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        if: github.event.action != 'closed'
        uses: quarto-dev/quarto-actions/setup@v2

      # No R or Python setup: contributors commit their _freeze/ output, so
      # the site renders from frozen results only.
      - name: Render site
        if: github.event.action != 'closed'
        uses: quarto-dev/quarto-actions/render@v2

      - name: Save PR metadata
        run: |
          mkdir -p pr-meta
          echo "${{ github.event.pull_request.number }}" > pr-meta/pr-number.txt
          echo "${{ github.event.action }}" > pr-meta/pr-action.txt

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: preview-site
          path: |
            _site
            pr-meta
          if-no-files-found: ignore

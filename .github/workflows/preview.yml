name: Preview

on:
  pull_request:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # No R or Python setup: contributors commit their _freeze/ output, so
      # the site renders from frozen results only.
      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Upload rendered site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site

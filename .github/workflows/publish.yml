name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# Renders the site and pushes it to the gh-pages branch. PR previews also
# live on gh-pages, under pr-preview/ (see preview-deploy.yml), so the
# deploy step leaves that folder alone rather than replacing the whole
# branch the way `quarto publish` did.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2


      - name: Render site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Add .nojekyll
        run: touch _site/.nojekyll

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview/
          force: false

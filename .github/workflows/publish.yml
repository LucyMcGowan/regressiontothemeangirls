name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:

# quarto publish pushes the rendered site to the gh-pages branch.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ github.ref }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # No R or Python setup: all computational output is committed under
      # _freeze/, so Quarto only needs to assemble the site.
      - name: Render and publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Preview Deploy

# Runs after Preview (preview.yml) finishes, in the context of the base
# repo rather than the PR's own branch — this is what makes it safe to
# grant write access even for PRs from forks: it never checks out or
# executes the fork's code, only the already-rendered site artifact.
on:
  workflow_run:
    workflows: [Preview]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: preview-deploy-${{ github.event.workflow_run.id }}
    steps:
      # Must run before downloading/unpacking the artifact: actions/checkout
      # defaults to clean:true, which runs `git clean -ffdx` and wipes any
      # untracked files already in the workspace.
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download preview artifact
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const match = artifacts.data.artifacts.find(a => a.name === "preview-site");
            if (!match) {
              core.setFailed("No preview-site artifact found on this run");
              return;
            }
            const download = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: match.id,
              archive_format: "zip",
            });
            const fs = require("fs");
            fs.writeFileSync(`${process.env.GITHUB_WORKSPACE}/preview-site.zip`, Buffer.from(download.data));

      - name: Unpack artifact
        run: unzip -o preview-site.zip -d preview

      - name: Read PR metadata
        id: pr
        run: |
          echo "number=$(cat preview/pr-meta/pr-number.txt)" >> "$GITHUB_OUTPUT"
          echo "action=$(cat preview/pr-meta/pr-action.txt)" >> "$GITHUB_OUTPUT"

      # comment: false — pr-preview-action's built-in PR comment can't find a
      # PR number under the workflow_run event, so it silently no-ops. We
      # post our own comment below instead, passing the number explicitly.
      - name: Deploy or remove preview
        id: preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: preview/_site
          pr-number: ${{ steps.pr.outputs.number }}
          action: ${{ steps.pr.outputs.action == 'closed' && 'remove' || 'deploy' }}
          comment: false

      - name: Comment preview link on PR
        if: steps.pr.outputs.action != 'closed'
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2
        with:
          number: ${{ steps.pr.outputs.number }}
          header: pr-preview
          message: |
            📖 Preview deployed: ${{ steps.preview.outputs.preview-url }}

      - name: Remove preview comment
        if: steps.pr.outputs.action == 'closed'
        uses: marocchino/sticky-pull-request-comment@67d0dec7b07ed060a405f9b2a64b8ab319fdd7db # v2.9.2
        with:
          number: ${{ steps.pr.outputs.number }}
          header: pr-preview
          delete: true
